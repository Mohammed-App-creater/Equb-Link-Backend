<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #4A90D9;
    --blue-light: #EBF4FF;
    --blue-mid: #D0E8FF;
    --blue-dark: #2D6FAF;
    --blue-muted: #7AAFD4;
    --white: #ffffff;
    --bg: #F7FAFD;
    --text: #1A2B3C;
    --muted: #7A95AE;
    --border: #DDE9F5;
    --radius: 20px;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: var(--blue-mid);
    top: -200px; right: -150px;
    opacity: 0.4;
    filter: blur(60px);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: var(--blue-mid);
    bottom: -100px; left: -80px;
    opacity: 0.3;
    filter: blur(50px);
    pointer-events: none;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 44px 36px 40px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(74,144,217,0.08), 0 1px 4px rgba(0,0,0,0.04);
    animation: cardIn 0.55s cubic-bezier(0.34,1.46,0.64,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(32px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .confetti-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: var(--radius);
    pointer-events: none;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: fall linear both;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(-10px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(320px) rotate(540deg); }
  }

  .icon-wrap {
    width: 88px; height: 88px;
    background: var(--blue-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    position: relative;
    animation: iconIn 0.5s 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes iconIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  .icon-wrap::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1.5px solid var(--blue);
    opacity: 0;
    animation: pulse 2.5s 1s ease-out infinite;
  }
  .icon-wrap::after {
    content: '';
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid var(--blue);
    opacity: 0;
    animation: pulse 2.5s 1.35s ease-out infinite;
  }

  @keyframes pulse {
    0%   { transform: scale(0.95); opacity: 0.45; }
    100% { transform: scale(1.12); opacity: 0; }
  }

  .check-svg { width: 44px; height: 44px; }
  .check-path {
    stroke: var(--blue);
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 56;
    stroke-dashoffset: 56;
    animation: draw 0.45s 0.55s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    margin-bottom: 8px;
    animation: fadeUp 0.4s 0.65s ease both;
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.65;
    animation: fadeUp 0.4s 0.78s ease both;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
    animation: fadeUp 0.4s 0.88s ease both;
  }

  .info-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeUp 0.4s 1s ease both;
  }

  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 16px;
  }
  .info-row + .info-row {
    border-top: 1px solid var(--border);
  }

  .info-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }

  .info-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--blue-dark);
    background: var(--blue-light);
    border: 1px solid var(--blue-mid);
    padding: 3px 10px;
    border-radius: 99px;
  }

  .close-hint {
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.6;
    animation: fadeUp 0.4s 1.1s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="confetti-wrap" id="confetti"></div>

  <div class="icon-wrap">
    <svg class="check-svg" viewBox="0 0 44 44">
      <path class="check-path" d="M9 23 L19 33 L35 13"/>
    </svg>
  </div>

  <h1>Payment Successful</h1>
  <p class="subtitle">Your Equb contribution has been<br>received successfully.</p>

  <div class="divider"></div>

  <div class="info-block">
    <div class="info-row">
      <span class="info-label">Status</span>
      <span class="badge">✓ Confirmed</span>
    </div>
    <div class="info-row">
      <span class="info-label">Powered by</span>
      <span class="info-value" style="color:var(--blue)">Chapa</span>
    </div>
  </div>

  <p class="close-hint">You can now close this window<br>and return to the app.</p>
</div>

<script>
  const wrap = document.getElementById('confetti');
  const colors = ['#4A90D9','#7AAFD4','#D0E8FF','#A8D0F0','#2D6FAF','#EBF4FF'];
  for (let i = 0; i < 22; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    const size = Math.random() * 7 + 4;
    dot.style.cssText = `
      width:${size}px;height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}%;
      top:${Math.random()*20}%;
      animation-duration:${Math.random()*1.2+1.6}s;
      animation-delay:${Math.random()*0.6+0.5}s;
    `;
    wrap.appendChild(dot);
  }
</script>
</body>
</html>
